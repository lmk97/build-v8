name: C API for V8 monolithic static library
on:
   [push]
#  release:
#    types:
#      - published

env:
  V8_VERSION: '14.8.178.39'

defaults:
  run:
    shell: bash

jobs:
  build-on-linux-aarch64:
    runs-on: ubuntu-22.04-arm
    env:
      V8_OS: linux
      V8_ARCH: aarch64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
      - name: V8 fetch and build
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0-rc3/LLVM-23.1.0-rc3-Linux-ARM64.tar.xz
          mkdir ./llvm-23
          tar -Jxf ./LLVM-23.1.0-rc3-Linux-ARM64.tar.xz -C ./llvm-23 --strip-components=1
          rm -rf ./LLVM-23.1.0-rc3-Linux-ARM64.tar.xz
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup component add rustfmt
          cargo install bindgen-cli
          mkdir -p "$HOME/.cargo/lib"
          ln -sf "$GITHUB_WORKSPACE/llvm-23/lib/libclang.so" "$HOME/.cargo/lib/libclang.so"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PATH:$HOME/.cargo/env:$GITHUB_WORKSPACE/depot_tools"
          export DEPOT_TOOLS_METRICS="0"
          export LIBCLANG_PATH="/usr/lib/llvm-23/lib"
          export RUSTC_BOOTSTRAP="1"
          gclient
          fetch v8
          cd $GITHUB_WORKSPACE/v8
          git checkout $V8_VERSION
          gclient sync
          mkdir "build-$V8_OS-$V8_ARCH"
          cp "../${{ github.event.repository.name }}/$V8_OS-$V8_ARCH.gn" "build-$V8_OS-$V8_ARCH/args.gn"
          echo "clang_base_path=\"$GITHUB_WORKSPACE/llvm-23\"" >> "build-$V8_OS-$V8_ARCH/args.gn"
          echo "rust_sysroot_absolute=\"$(rustc --print sysroot)\"" >> "build-$V8_OS-$V8_ARCH/args.gn"
          echo "rust_bindgen_root=\"$HOME/.cargo\"" >> "build-$V8_OS-$V8_ARCH/args.gn"
          echo "rust_force_head_revision=true" >> "build-$V8_OS-$V8_ARCH/args.gn"
          echo "rustc_version=\"$(rustc --version | cut -d' ' -f2)\"" >> "build-$V8_OS-$V8_ARCH/args.gn"
          export RUST_SYSROOT=$(rustc --print sysroot)
          build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          gn gen "build-$V8_OS-$V8_ARCH"
          ninja -j 4 v8_monolith -C "build-$V8_OS-$V8_ARCH"
