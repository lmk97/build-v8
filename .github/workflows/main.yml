name: C API for V8 monolithic static library
on:
   [push]
#  release:
#    types:
#      - published

env:
  V8_VERSION: '15.2.124.1'

defaults:
  run:
    shell: bash

jobs:
  build-on-windows-aarch64:
    runs-on: windows-2022
    env:
      V8_OS: windows
      V8_ARCH: aarch64
    steps:
      - name: Source code checkout
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
      - name: V8 fetch and build
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          export DEPOT_TOOLS_METRICS="0"
          export DEPOT_TOOLS_WIN_TOOLCHAIN="0"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global core.fscache true
          git config --global core.preloadindex true
          git config --global depot-tools.allowGlobalGitConfig true
          gclient
          fetch v8
          cd $GITHUB_WORKSPACE/v8
          git checkout $V8_VERSION
          gclient sync
          mkdir "target-$V8_OS-$V8_ARCH"
          cp "../${{ github.event.repository.name }}/$V8_OS-$V8_ARCH.gn" "target-$V8_OS-$V8_ARCH/args.gn"
          gn gen "target-$V8_OS-$V8_ARCH"
          ninja -j 4 v8_monolith -C "target-$V8_OS-$V8_ARCH"
