name: C API for V8 monolithic static library
on:
   [push]
#  release:
#    types:
#      - published

env:
  V8_VERSION: '15.2.124.4'

defaults:
  run:
    shell: bash

jobs:
  build-on-linux-aarch64:
    runs-on: ubuntu-22.04-arm
    env:
      V8_OS: linux
      V8_ARCH: aarch64
    steps:
      - name: Source code checkout
        uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
      - name: V8 fetch and build
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export DEPOT_TOOLS_METRICS=0
          export PATH="$PATH:$GITHUB_WORKSPACE/depot_tools"
          gclient
          fetch v8
          cd $GITHUB_WORKSPACE/v8
          git checkout $V8_VERSION
          gclient sync
          echo "-------------------------------------------"
          ls ./build/rust
          echo "-------------------------------------------"
          cat ./build/rust/std/BUILD.gn
